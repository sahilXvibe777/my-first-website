<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARK SHOP - Main</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --red-vibrant: #ff0040;
            --pink-vibrant: #d6006e;
            --dark-bg: #120008;
            --glass-border: rgba(255, 255, 255, 0.25);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--pink-vibrant);
            border-radius: 10px;
        }

        body {
            /* Rich Animated Mesh Gradient */
            background: linear-gradient(135deg, #18000a 0%, #4a001a 30%, #80002e 60%, #ff0040 85%, #d6006e 100%);
            background-size: 400% 400%;
            animation: meshGradient 12s ease infinite;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Background Light Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.65;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 12s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #ff0055;
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #e6005c;
            bottom: -150px;
            right: -100px;
            animation-delay: -6s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.1); }
            100% { transform: translate(-30px, 40px) scale(0.95); }
        }

        /* Glassmorphism Frame Container */
        .glass-frame {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            min-height: calc(100vh - 48px);
            background: rgba(18, 2, 8, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 24px;
            animation: fadeInPage 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        @keyframes fadeInPage {
            0% { opacity: 0; transform: scale(0.97) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Header Styling */
        header {
            width: 100%;
            max-width: 850px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: auto;
        }

        .glowing-hr {
            flex: 1;
            height: 2px;
            border: 0;
            background: linear-gradient(90deg, transparent, #ff0055, #ffffff, #ff0055, transparent);
            background-size: 200% 100%;
            animation: pulseLine 3s linear infinite;
            border-radius: 2px;
        }

        @keyframes pulseLine {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        header h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 20%, #ff99bb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(255, 0, 85, 0.5);
            white-space: nowrap;
            padding: 0 10px;
        }

        /* Card Section Wrapper */
        .card-container {
            margin: auto 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .card-glow-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 26px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255, 0, 80, 0.8), rgba(255,255,255,0.2));
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-glow-wrapper:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(255, 0, 80, 0.4),
                        0 0 30px rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #ffffff, #ff0055, #ffffff);
        }

        .glass-box {
            background: rgba(30, 5, 15, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 44px 36px;
            text-align: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .glass-box h2 {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff80ab;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .glass-box p {
            font-size: 1.05rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Styled Anchor Tag Button */
        .btn-link {
            display: inline-block;
            text-decoration: none;
            padding: 14px 36px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.05));
            border: 2px solid #ffffff;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
            letter-spacing: 0.8px;
        }

        .btn-link:hover {
            background: #ffffff;
            color: #d6006e;
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.9),
                        0 10px 25px rgba(214, 0, 110, 0.5);
        }

        @media (max-width: 640px) {
            header h1 { font-size: 2.1rem; }
            .glass-frame { padding: 24px 16px; }
            .glass-box { padding: 32px 20px; }
            .glass-box h2 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <main class="glass-frame">
        <!-- Header -->
        <header>
            <div class="glowing-hr"></div>
            <h1>SPARK SHOP</h1>
            <div class="glowing-hr"></div>
        </header>

        <!-- Main Card Section -->
        <div class="card-container">
            <div class="card-glow-wrapper">
                <div class="glass-box">
                    <h2>Sahil</h2>
                    <div class="subtitle">Computer Science & Engineering Student</div>
                    <p>
                        Hello! I am learning frontend development and web design. This project showcases my HTML, CSS, and animation skills as part of my practical work.
                    </p>
                    <!-- Anchor tag linking to about.html -->
                    <a href="index.html" class="btn-link" target="_blank">About Us Page</a>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
