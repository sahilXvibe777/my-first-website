<!DOCTYPE html>
<html lang="en">
<head>
  <style>

/* YouTube and Normal Video Responsive Size */

iframe,
video {
    width: 100%;
    max-width: 560px;
    aspect-ratio: 16 / 9;
    height: auto;
    display: block;
    margin: 20px auto;
    border-radius: 12px;
    object-fit: contain;
}

/* Mobile Screen */
@media (max-width: 600px) {
    iframe,
    video {
        max-width: 100%;
    }
}

    
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Audio and Video Lab</title>
</head>
<body>
<h1>HTML Audio and Video Lab</h1>
<section>
  <h2> the title of the video playing</h2>
  <video controls width="640">
  <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
</video>
</section> 
<section>
  <h2>the title of the song playing</h2>
<audio 
loop
src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
controls>
</audio>
</section>
 
</body>
</html>
