<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    
/* YouTube and Normal Video Responsive Size */

iframe,
video {
    width: 100%;
    max-width: 560px;
    aspect-ratio: 16 / 9;
    height: auto;
    display: block;
    margin: 20px auto;
    border-radius: 12px;
    object-fit: contain;
}

/* Mobile Screen */
@media (max-width: 600px) {
    iframe,
    video {
        max-width: 100%;
    }
}

  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working with the HTML Video Element</title>
</head>
<body>
  <h1>Working with the HTML Video Element</h1>
  <video
    width="640"
    loop
    controls
    muted
    poster="https://cdn.freecodecamp.org/curriculum/labs/past-event2.jpg"
  >
    <source
      src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
      type="video/mp4"
    >
    <source
      src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.webm"
      type="video/webm"
    >
    <source
      src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.ogg"
      type="video/ogg"
    >
<source
src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.mov" type="video/quicktime"    
  </video>
</body>
</html>
