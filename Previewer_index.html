<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARK SHOP - Responsive Device Previewer</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        spark: {
                            bg: '#120008', dark: '#18000a', crimson: '#80002e',
                            pink: '#d6006e', vibrant: '#ff0040', glow: '#ff0055', lightPink: '#ff99bb'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #120008; }
        ::-webkit-scrollbar-thumb { background: #d6006e; border-radius: 4px; }
        
        .glass-panel {
            background: rgba(24, 0, 10, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.25s ease;
        }
        .glass-button:hover {
            background: rgba(255, 0, 85, 0.25);
            border-color: #ff0055;
        }
        .glass-button.active {
            background: linear-gradient(135deg, #d6006e, #ff0040);
            border-color: #ff99bb;
        }
        .viewport-container {
            transition: transform 0.2s ease-out;
            transform-origin: top center;
        }
        .animated-bg {
            background: linear-gradient(135deg, #18000a 0%, #4a001a 30%, #80002e 60%, #ff0040 85%, #d6006e 100%);
            background-size: 400% 400%;
            animation: meshGradient 15s ease infinite;
        }
        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="animated-bg text-white min-h-screen flex flex-col font-sans overflow-x-hidden">

    <!-- Top Toolbar -->
    <header class="sticky top-0 z-50 glass-panel border-b border-white/10 px-4 py-3 shadow-2xl">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-spark-pink to-spark-vibrant flex items-center justify-center shadow-lg border border-white/30">
                    <i data-lucide="smartphone" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-white via-spark-lightPink to-spark-vibrant bg-clip-text text-transparent">
                        SPARK SHOP
                    </h1>
                    <p class="text-xs text-white/60 font-medium">Responsive Viewport Tester</p>
                </div>
            </div>

            <!-- Page Buttons -->
            <div class="flex flex-wrap items-center gap-2">
                <div class="flex bg-black/40 p-1 rounded-xl border border-white/10">
                    <button id="btn-page-main" onclick="setPage('SPARK.index.html')" class="glass-button active px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                        <i data-lucide="home" class="w-3.5 h-3.5"></i> Main Page
                    </button>
                    <button id="btn-page-about" onclick="setPage('index.html')" class="glass-button px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                        <i data-lucide="info" class="w-3.5 h-3.5"></i> About Page
                    </button>
                </div>
            </div>

            <!-- Zoom Controls -->
            <div class="flex items-center gap-3 bg-black/40 px-3 py-1.5 rounded-xl border border-white/10">
                <i data-lucide="zoom-in" class="w-4 h-4 text-white/60"></i>
                <input type="range" id="zoom-slider" min="30" max="100" value="85" oninput="handleZoomChange(this.value)" class="w-24 h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer accent-spark-vibrant">
                <span id="zoom-value" class="text-xs font-mono text-spark-lightPink w-10 text-right">85%</span>
            </div>

        </div>
    </header>

    <!-- Preset Buttons Bar -->
    <div class="glass-panel border-b border-white/10 px-4 py-2.5">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-bold uppercase text-white/50 mr-1">Presets:</span>
                <button onclick="setDimensions(1920, 1080)" class="glass-button px-3 py-1 rounded-lg text-xs">Desktop</button>
                <button onclick="setDimensions(1366, 768)" class="glass-button px-3 py-1 rounded-lg text-xs">Laptop</button>
                <button onclick="setDimensions(768, 1024)" class="glass-button px-3 py-1 rounded-lg text-xs">Tablet</button>
                <button onclick="setDimensions(375, 812)" class="glass-button active px-3 py-1 rounded-lg text-xs">Mobile (375x812)</button>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 overflow-auto p-6 flex justify-center items-start min-h-[calc(100vh-130px)]">
        <div id="viewport-wrapper" class="viewport-container" style="transform: scale(0.85);">
            <div id="device-border" class="relative bg-zinc-900 border-4 border-zinc-700 rounded-[32px] p-3 shadow-2xl">
                <!-- Frame Screen -->
                <div class="overflow-hidden rounded-[22px] bg-black">
                    <iframe id="main-iframe" src="SPARK.index.html" style="width: 375px; height: 812px;" class="border-0 block"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function setPage(pageUrl) {
            document.getElementById('main-iframe').src = pageUrl;
            if(pageUrl === 'SPARK.index.html') {
                document.getElementById('btn-page-main').classList.add('active');
                document.getElementById('btn-page-about').classList.remove('active');
            } else {
                document.getElementById('btn-page-about').classList.add('active');
                document.getElementById('btn-page-main').classList.remove('active');
            }
        }

        function setDimensions(width, height) {
            const iframe = document.getElementById('main-iframe');
            iframe.style.width = width + 'px';
            iframe.style.height = height + 'px';
        }

        function handleZoomChange(val) {
            const wrap = document.getElementById('viewport-wrapper');
            wrap.style.transform = `scale(${val / 100})`;
            document.getElementById('zoom-value').innerText = `${val}%`;
        }
    </script>
</body>
</html>
